<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UZEX AI помощник</title>
<meta name="theme-color" content="#0C1033">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- шрифты не блокируют первую отрисовку: поле появляется сразу, текст подхватывает шрифт по готовности -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" id="gf" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="uzex-ds.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="edges" aria-hidden="true"></canvas>

<div class="app" id="app">

  <!-- Рейл (десктоп): история свёрнута по умолчанию -->
  <nav class="rail" aria-label="Чаты">
    <button class="ib" id="histBtn" type="button" aria-expanded="false" aria-controls="hist" data-i18n-label="history" data-icon="panel"></button>
    <button class="ib" id="newBtn" type="button" data-i18n-label="newChat" data-icon="plus"></button>
  </nav>

  <!-- История -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="hist" id="hist" aria-labelledby="histTitle">
    <header class="hist-h">
      <h2 class="mono" id="histTitle" data-i18n="history"></h2>
      <button class="ib" id="histClose" type="button" data-i18n-label="close" data-icon="close"></button>
    </header>
    <button class="hist-new" id="histNew" type="button"><span data-icon="plus"></span><span data-i18n="newChat"></span></button>
    <div class="hist-list" id="histList"></div>
  </aside>

  <header class="top">
    <button class="ib only-m" id="histBtnM" type="button" aria-expanded="false" aria-controls="hist" data-i18n-label="history" data-icon="panel"></button>
    <a class="wm" href="#" id="home" aria-label="UZEX AI"><span class="pl bg-w">UZEX</span><span class="pl bg-n">AI</span></a>
    <div class="top-r">
      <div class="lang" role="group" data-i18n-label="lang">
        <span class="lang-k" aria-hidden="true"></span>
        <button type="button" data-l="ru" aria-pressed="true">RU</button>
        <button type="button" data-l="uz" aria-pressed="false">UZ</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="hero" id="hero">
      <h1 class="q-title">
        <span class="ln"><span class="pl bg-w"><span class="pl-t" data-i18n="t1"></span></span></span>
        <span class="ln s"><span class="pl bg-n"><span class="pl-t" data-i18n="t2"></span></span></span>
      </h1>
    </section>

    <div class="thread" id="thread" aria-live="polite">
      <div class="thread-in" id="threadIn"></div>
    </div>

    <div class="dock" id="dock">
      <form class="ask" id="ask" autocomplete="off">
        <div class="ask-field">
          <textarea id="q" rows="1" enterkeyhint="send" data-i18n-label="ask"></textarea>
          <div class="ask-ph" id="ph" aria-hidden="true"><span class="ph-t" id="phT"></span><i class="ph-c"></i></div>
        </div>
        <div class="ask-bar">
          <span class="ask-hint mono" id="hint"><kbd>Tab</kbd> <span data-i18n="tabHint"></span></span>
          <button class="send" id="send" type="submit" data-i18n-label="send">
            <span class="ico-send" data-icon="arrow"></span>
            <span class="ico-stop" data-icon="stop"></span>
          </button>
        </div>
      </form>
      <p class="made mono">Made with <span class="heart" data-icon="heart" role="img" aria-label="love"></span> by <a class="made-a" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">devtones</a></p>
    </div>
  </main>
</div>

<canvas id="px" aria-hidden="true"></canvas>
<canvas id="cur" aria-hidden="true"></canvas>

<script src="app.js"></script>
</body>
</html>
